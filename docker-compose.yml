version: "3.8"

services:
  koha-db:
    image: mariadb:10.5
    container_name: koha-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: koha_library
      MYSQL_USER: koha_library
      MYSQL_PASSWORD: koha_library
    volumes:
      - koha-db-data:/var/lib/mysql
    networks:
      - koha-net

    # MariaDB healthcheck — Koha waits until this passes
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  koha-app:
    image: digibib/koha:latest
    container_name: koha-app

    # Koha will NOT start until DB is healthy
    depends_on:
      koha-db:
        condition: service_healthy

    restart: unless-stopped

    environment:
      KOHA_INSTANCE: risinglibrary
      KOHA_DB_HOST: koha-db
      KOHA_DB_NAME: koha_library
      KOHA_DB_USER: koha_library
      KOHA_DB_PASS: koha_library

      # Disable ping — Codespaces blocks ICMP
      KOHA_NO_PING: 1

    ports:
      - "8080:8080"   # Staff
      - "8081:80"     # OPAC

    volumes:
      - koha-app-data:/var/lib/koha

    networks:
      - koha-net

volumes:
  koha-db-data:
  koha-app-data:

networks:
  koha-net: