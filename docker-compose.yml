services:
  db:
    image: mariadb:10.5
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - kohanet

  koha:
    build:
      context: .
    env_file: .env
    depends_on:
      - db
    volumes:
      - inst-data:/var/lib/koha
      - etc-data:/etc/koha/sites
    networks:
      - kohanet
    healthcheck:
      test: ["CMD", "test", "-f", "/healthy"]
      interval: 10s
      start_period: 2m

  apache2:
    image: local/koha:latest
    env_file: .env
    depends_on:
      koha:
        condition: service_healthy
    ports:
      - "${KOHA_INTRANET_PORT}:8081"
      - "${KOHA_OPAC_PORT}:8080"
    networks:
      - kohanet

networks:
  kohanet:

volumes:
  db-data:
  inst-data:
  etc-data:
