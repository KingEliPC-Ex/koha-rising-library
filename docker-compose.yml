services:
  koha-db:
    image: mariadb:10.5
    container_name: koha-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: koha_library
      MYSQL_USER: koha_library
      MYSQL_PASSWORD: koha_library
    volumes:
      - koha-db-data:/var/lib/mysql
    networks:
      - koha-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  koha-app:
    image: digibib/koha:latest
    container_name: koha-app
    depends_on:
      koha-db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      KOHA_INSTANCE: risinglibrary
      KOHA_DB_HOST: koha-db
      KOHA_DB_NAME: koha_library
      KOHA_DB_USER: koha_library
      KOHA_DB_PASS: koha_library
      KOHA_NO_PING: 1
    entrypoint: ["/bin/sh", "/koha-entrypoint.sh"]
    ports:
      - "8080:8080"
      - "8081:80"
    volumes:
      - koha-app-data:/var/lib/koha
      - ./koha-entrypoint.sh:/koha-entrypoint.sh:ro
    networks:
      - koha-net

volumes:
  koha-db-data:
  koha-app-data:

networks:
  koha-net: