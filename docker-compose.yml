version: '3'

services:
  db:
    image: mariadb:10.5
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ${DB_VOLUME}:/var/lib/mysql:delegated
    networks:
      - kohanet
    healthcheck:
      test: ["CMD-SHELL", "mysql --user=${MYSQL_USER} --password=${MYSQL_PASSWORD} --host=${MYSQL_SERVER} ${MYSQL_DATABASE} -e 'select 1'"]
      interval: 10s
      start_period: "2m"
      start_interval: "2s"

  es:
    image: koha/elasticsearch-icu:latest
    restart: always
    environment:
      - cluster.name=docker-cluster
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - kohanet
    healthcheck:
      test: ["CMD", "curl", "-f", "127.0.0.1:9200"]
      interval: 10s
      start_period: "2m"
      start_interval: "2s"

  memcached:
    image: memcached:latest
    command: memcached -m 64m
    networks:
      - kohanet
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -c 'exec 3<>/dev/tcp/localhost/11211; printf \"stats\nquit\n\" >&3'"]
      interval: 10s
      start_period: "2m"
      start_interval: "5s"

  koha:
    image: koha/koha:latest
    depends_on:
      db:
        condition: service_started
      memcached:
        condition: service_healthy
      es:
        condition: service_healthy
    env_file:
      - .env
    environment:
      USE_BACKEND: 1
      USE_APACHE2: 0
      USE_CRON: 0
      USE_SIP: ${USE_SIP}
      USE_Z3950: 0
    volumes:
      - ${INSTANCE_VOLUME}:/var/lib/koha
      - ${ETC_VOLUME}:/etc/koha/sites
    networks:
      - kohanet
    healthcheck:
      test: ["CMD", "test", "-f", "/healthy"]
      interval: 10s
      start_period: "2m"
      start_interval: "5s"

  apache2:
    image: koha/koha:latest
    restart: always
    depends_on:
      koha:
        condition: service_healthy
    env_file:
      - .env
    environment:
      USE_BACKEND: 0
      USE_APACHE2: 1
      USE_CRON: 0
      USE_SIP: ${USE_SIP}
      USE_Z3950: 0
    networks:
      kohanet:
        aliases:
          - "${KOHA_INTRANET_PREFIX}${KOHA_INSTANCE}${KOHA_INTRANET_SUFFIX}${KOHA_DOMAIN}"
          - "${KOHA_OPAC_PREFIX}${KOHA_INSTANCE}${KOHA_OPAC_SUFFIX}${KOHA_DOMAIN}"
    ports:
      - "${KOHA_INTRANET_PORT}:8081"
      - "${KOHA_OPAC_PORT}:8080"

  cron:
    image: koha/koha:latest
    restart: always
    depends_on:
      koha:
        condition: service_healthy
    env_file:
      - .env
    environment:
      USE_BACKEND: 0
      USE_APACHE2: 0
      USE_CRON: 1
      USE_SIP: ${USE_SIP}
      USE_Z3950: 0
    networks:
      - kohanet

networks:
  kohanet:

volumes:
  db-data: